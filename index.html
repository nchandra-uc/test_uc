<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Component</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 20px;
        }

        .container {
            background-color: #f5f5f5;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .tabs {
            display: flex;
            gap: 8px;
        }

        .tab {
            background-color: #e8e8e8;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: #333;
        }

        .tab:hover {
            background-color: #d8d8d8;
        }

        .tab.active {
            background-color: #ffffff;
            border-color: #b0b0b0;
        }

        .tab-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-icon::before {
            content: '';
            width: 14px;
            height: 14px;
            border: 1.5px solid #666;
            border-radius: 2px;
            position: relative;
        }

        .tab-icon.checklist::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 1.5px;
            background-color: #666;
            top: 4px;
            left: 3px;
            box-shadow: 0 3px 0 #666, 0 6px 0 #666;
        }

        .gallery-button {
            background-color: #e8e8e8;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: #333;
            width: 100%;
        }

        .gallery-button:hover {
            background-color: #d8d8d8;
        }

        .ellipsis {
            display: flex;
            gap: 3px;
        }

        .ellipsis::before,
        .ellipsis::after {
            content: '';
            width: 4px;
            height: 4px;
            background-color: #666;
            border-radius: 50%;
        }

        .ellipsis::before {
            content: '';
            width: 4px;
            height: 4px;
            background-color: #666;
            border-radius: 50%;
            box-shadow: -6px 0 0 #666, 6px 0 0 #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <div class="tab active">
                <div class="tab-icon checklist"></div>
                <span>To-do list</span>
            </div>
            <div class="tab">
                <div class="tab-icon"></div>
                <span>Meeting nc</span>
            </div>
        </div>
        <button class="gallery-button">
            <div class="ellipsis"></div>
            <span>Open Gallery</span>
        </button>
    </div>
</body>
</html>
