<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list & Meeting Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
            padding: 0 20px;
            background-color: #fafafa;
            border-radius: 8px 8px 0 0;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 14px;
            color: #666;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            position: relative;
        }

        .tab:hover {
            background-color: #f0f0f0;
            color: #333;
        }

        .tab.active {
            color: #333;
            border-bottom-color: #007AFF;
        }

        .tab-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }

        .content-area {
            flex: 1;
            padding: 40px;
            background-color: white;
            position: relative;
        }

        .open-gallery-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background-color: #f8f8f8;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            transition: all 0.2s;
        }

        .open-gallery-btn:hover {
            background-color: #f0f0f0;
            border-color: #d0d0d0;
        }

        .ellipsis {
            font-size: 18px;
            line-height: 1;
        }

        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding-top: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" data-tab="todo">
                <span class="tab-icon">📋</span>
                <span>To-do list</span>
            </button>
            <button class="tab" data-tab="meeting">
                <span class="tab-icon">📝</span>
                <span>Meeting nc</span>
            </button>
        </div>
        
        <div class="content-area">
            <div class="content active" id="todo-content">
                <div class="empty-state">
                    <h2>To-do List</h2>
                    <p>Your to-do items will appear here</p>
                </div>
            </div>
            
            <div class="content" id="meeting-content">
                <div class="empty-state">
                    <h2>Meeting Notes</h2>
                    <p>Your meeting notes will appear here</p>
                </div>
            </div>
            
            <button class="open-gallery-btn">
                <span class="ellipsis">⋯</span>
                <span>Open Gallery</span>
            </button>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const contents = document.querySelectorAll('.content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.getAttribute('data-tab');
                
                // Remove active class from all tabs and contents
                tabs.forEach(t => t.classList.remove('active'));
                contents.forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked tab and corresponding content
                tab.classList.add('active');
                document.getElementById(`${targetTab}-content`).classList.add('active');
            });
        });

        document.querySelector('.open-gallery-btn').addEventListener('click', () => {
            alert('Opening Gallery...');
        });
    </script>
</body>
</html>
